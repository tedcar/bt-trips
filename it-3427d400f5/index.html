<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andy's Italy Flights</title>
<meta name="description" content="Business class options for Andy and family, Memphis to Rome and Venice to Memphis, June 26 to July 4, 2027.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen slide deck, one idea per slide, navy night-cabin palette with brass accents */
:root{
  color-scheme:dark;
  --navy:#141a26; --navy-2:#1b2230; --navy-3:#252c3c;
  --gold:#c9a96e; --gold-2:#d9bd86; --gold-deep:#a8834a;
  --ink:#f4f1ea; --muted:#aab1c0; --dim:#7d8597;
  --sky:#7fb4e6; --ok:#7fd1a8; --warn:#e8a87c;
  --bg:var(--navy);
}
*{box-sizing:border-box}
body,h1,h2,h4,h5,p,ul{margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
.serif{font-family:Fraunces,Georgia,serif}

/* deck */
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;overflow:hidden;transform:translateX(var(--off,60px)) scale(.985);transition:opacity .9s cubic-bezier(.22,.61,.36,1),transform 1.1s cubic-bezier(.16,1,.3,1),visibility 0s linear 1.1s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .9s cubic-bezier(.22,.61,.36,1),transform 1.1s cubic-bezier(.16,1,.3,1),visibility 0s}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;transform:scale(1.02);transition:transform 14s ease-out}
.slide.on .bg{transform:scale(1.12)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,26,38,.94) 0%,rgba(20,26,38,.78) 42%,rgba(20,26,38,.25) 100%)}
.shade.full{background:rgba(20,26,38,.72)}
.shade.bottom{background:linear-gradient(0deg,rgba(20,26,38,.96) 0%,rgba(20,26,38,.6) 45%,rgba(20,26,38,.1) 100%)}
.wrap{position:relative;width:min(1180px,100%);padding:72px 56px 96px;max-height:100%;overflow-y:auto;scrollbar-width:none}
.wrap::-webkit-scrollbar{display:none}

/* entrance */
[data-a]{opacity:0;transform:translateY(26px);filter:blur(6px);transition:opacity .9s ease,transform 1s cubic-bezier(.16,1,.3,1),filter .9s ease}
.slide.on [data-a]{opacity:1;transform:none;filter:none}
.slide.on [data-a="1"]{transition-delay:.15s}.slide.on [data-a="2"]{transition-delay:.35s}
.slide.on [data-a="3"]{transition-delay:.55s}.slide.on [data-a="4"]{transition-delay:.75s}
.slide.on [data-a="5"]{transition-delay:.95s}.slide.on [data-a="6"]{transition-delay:1.15s}
.slide.on [data-a="7"]{transition-delay:1.35s}.slide.on [data-a="8"]{transition-delay:1.55s}

.kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(34px,5.6vw,68px);line-height:1.05;letter-spacing:-.01em;margin-top:14px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,4vw,48px);line-height:1.1;margin-top:12px}
.lead{font-size:clamp(17px,1.6vw,21px);line-height:1.55;color:#dfe3ea;margin-top:18px;max-width:640px}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.gold{color:var(--gold-2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(201,169,110,.14);border:1px solid rgba(201,169,110,.45);color:var(--gold-2);font-size:13px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:30px;max-width:900px}
.stat{background:rgba(37,44,60,.72);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 16px 14px;backdrop-filter:blur(6px)}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600;color:#fff}
.stat span{font-size:13px;color:var(--muted);line-height:1.4;display:block;margin-top:4px}

/* timeline */
.tl{margin-top:26px;max-width:760px;position:relative}
.tl:before{content:"";position:absolute;left:105px;top:16px;bottom:16px;width:2px;background:linear-gradient(var(--gold),rgba(201,169,110,.15));transform:scaleY(0);transform-origin:top;transition:transform 2.4s cubic-bezier(.16,1,.3,1) .4s}
.slide.on .tl:before{transform:scaleY(1)}
.leg{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.leg:last-child{border-bottom:0}
.leg .t{font-weight:700;font-size:18px;color:#fff}
.leg .t small{display:block;font-weight:500;font-size:12px;color:var(--dim);margin-top:2px}
.leg h4{font-size:18px;font-weight:600;color:#fff}
.leg p{font-size:14.5px;color:#cfd4de;line-height:1.5;margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-left:8px;vertical-align:2px}
.tag.flat{background:rgba(127,209,168,.16);color:var(--ok)}
.tag.eu{background:rgba(127,180,230,.16);color:var(--sky)}
.tag.ec{background:rgba(170,177,192,.16);color:var(--muted)}
.tag.pe{background:rgba(232,168,124,.16);color:var(--warn)}
.stop{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:10px 0}
.stop div:last-child{background:rgba(201,169,110,.1);border-left:3px solid var(--gold);border-radius:6px;padding:9px 13px;font-size:14px;color:#e9dcc2;line-height:1.45}

/* two column */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.photo{border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative}
.photo img{display:block;width:100%;height:auto}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;font-size:11px;color:#d3d7df;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
ul.ticks{list-style:none;margin-top:20px}
ul.ticks li{position:relative;padding:8px 0 8px 30px;font-size:16px;line-height:1.45;color:#e3e6ec}
ul.ticks li:before{content:"";position:absolute;left:2px;top:13px;width:14px;height:8px;border-left:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);transform:rotate(-45deg)}

/* seat map */
.mapbox{position:relative;width:min(100%,420px);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.mapbox img{display:block;width:100%;height:auto}
.ring{position:absolute;border-radius:12px;border:3px solid var(--gold-deep);box-shadow:0 0 0 0 rgba(201,169,110,.7);opacity:0;transform:scale(.6);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1.3)}
.ring.kid{border-color:#1f6eaa;box-shadow:0 0 0 0 rgba(31,110,170,.6)}
.slide.on .ring{opacity:1;transform:none;animation:pulse 2.2s ease-out 1.4s infinite}
.slide.on .ring.r2{transition-delay:.9s}.slide.on .ring.r3{transition-delay:1.2s}.slide.on .ring.r1{transition-delay:.6s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,169,110,.55)}70%{box-shadow:0 0 0 14px rgba(201,169,110,0)}100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}}
.ring .lbl{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:var(--gold-deep);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.ring.kid .lbl{background:#1f6eaa}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}
.legend span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#dfe3ea}
.legend i{width:16px;height:16px;border-radius:5px;border:3px solid var(--gold-deep)}
.legend i.k{border-color:#1f6eaa}
.credit{font-size:11px;color:var(--dim);margin-top:10px}

/* route */
.route{width:100%;max-width:1060px;margin-top:18px}
.route path.arc{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.6s ease}
.slide.on .route path.arc{stroke-dashoffset:0}
.slide.on .route path.d2{transition-delay:.6s}.slide.on .route path.d3{transition-delay:1.2s}
.slide.on .route path.d4{transition-delay:1.9s}.slide.on .route path.d5{transition-delay:2.5s}.slide.on .route path.d6{transition-delay:3.1s}
.route circle{fill:#fff}
.route text{font:600 15px Inter,sans-serif;fill:#e9ecf2}
.route text.c{font-size:12px;font-weight:500;fill:var(--muted)}
.keyrow{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#dfe3ea;margin-top:6px}
.keyrow i{display:inline-block;width:26px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}

/* price compare */
.bars{margin-top:26px;max-width:860px}
.bar{margin:14px 0}
.bar .top{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:#e3e6ec}
.bar .top b{font-variant-numeric:tabular-nums}
.bar .track{height:14px;background:rgba(255,255,255,.07);border-radius:999px;margin-top:7px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:999px;background:#5b6477;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.bar.you .fill{background:linear-gradient(90deg,var(--gold-deep),var(--gold-2))}
.bar.you .top{color:#fff;font-weight:700}
.bar .note{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.4}
.big{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(46px,8vw,96px);line-height:1;color:var(--gold-2);font-variant-numeric:tabular-nums}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.card{background:rgba(37,44,60,.8);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px}
.card h5{font-size:16px;color:#fff;font-weight:700}
.card p{font-size:14px;color:#cfd4de;line-height:1.5;margin-top:6px}
.card.warn{border-color:rgba(232,168,124,.4)}

/* CTA */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:17px 30px;border-radius:12px;font-weight:700;font-size:18px;text-decoration:none;transition:transform .15s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 12px 34px rgba(201,169,110,.35)}
.btn.ghost{border:2px solid rgba(255,255,255,.5);color:#fff}
.btn.gold.pulse{animation:cta 2.4s ease-in-out 1.6s infinite}
@keyframes cta{0%,100%{box-shadow:0 12px 34px rgba(201,169,110,.35)}50%{box-shadow:0 12px 50px rgba(201,169,110,.7)}}
.price{font-family:Fraunces,Georgia,serif;font-size:clamp(40px,6vw,72px);font-weight:700;color:#fff;line-height:1}
.price small{font-family:Inter,sans-serif;font-size:18px;font-weight:500;color:var(--muted)}
.others{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.others a{font-size:14px;color:var(--gold-2);text-decoration:none;border-bottom:1px solid rgba(201,169,110,.4);padding-bottom:2px}

/* chrome */
.top-bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;z-index:5;pointer-events:none}
.top-bar img{height:26px;width:auto;pointer-events:auto}
.top-bar .who{font-size:12px;color:var(--muted);letter-spacing:.06em}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));z-index:5;background:linear-gradient(0deg,rgba(20,26,38,.9),rgba(20,26,38,0))}
.nav button{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(37,44,60,.85);color:#fff;border-radius:10px;height:42px;min-width:42px;padding:0 14px;font:600 14px Inter,sans-serif;cursor:pointer}
.nav button:hover{border-color:var(--gold)}
.progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s cubic-bezier(.16,1,.3,1)}
.timer{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:6;pointer-events:none}
.timer i{display:block;height:100%;width:0;background:var(--gold-2)}
.timer.run i{animation:tick var(--dur,8s) linear forwards}
@keyframes tick{from{width:0}to{width:100%}}
.nav button.playing{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.plane{opacity:0;transition:opacity .4s ease}
.plane path{fill:#fff}
.bg{will-change:transform}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.hint{position:fixed;right:24px;bottom:72px;font-size:12px;color:var(--dim);z-index:5}

@media (max-width:860px){
  .wrap{padding:64px 16px 104px}
  .split{grid-template-columns:1fr;gap:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:1fr}
  .leg,.stop{grid-template-columns:72px 1fr;gap:12px}
  .tl:before{left:77px}
  .shade{background:linear-gradient(0deg,rgba(20,26,38,.97) 0%,rgba(20,26,38,.88) 48%,rgba(20,26,38,.2) 78%,rgba(20,26,38,.35) 100%)}
  .slide:has(.shade:not(.full)){align-items:flex-end}
  .hint{display:none}
  .mapbox{width:min(100%,340px)}
  .btn{width:100%}
  .route text{font-size:22px}.route text.c{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:.01s!important;animation:none!important}
}
</style>

<section class="slide">
  <div class="wrap">
    <div class="kicker" data-a="1">Day one &middot; Saturday, June 26</div>

<section class="slide">
  <div class="wrap split">
    <div>
      <div class="kicker" data-a="1">The overnight seat &middot; TAP A330-900neo</div>
      <h2 data-a="2">Everyone gets a real bed, and their own way out.</h2>

<section class="slide">

  }
  function show(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    var dir=n>=i?1:-1, cur=slides[i], nxt=slides[n];
    if(n!==i){
      cur.style.setProperty('--off',(-dir*60)+'px'); cur.classList.remove('on');
      nxt.style.transition='none'; nxt.style.setProperty('--off',(dir*60)+'px'); void nxt.offsetWidth; nxt.style.transition='';
    }
    i=n; nxt.classList.add('on');
    var w=nxt.querySelector('.wrap'); if(w) w.scrollTop=0;
    runCounters(nxt); planes(nxt);
    bar.style.width=((i+1)/slides.length*100)+'%';
    count.textContent=(i+1)+' / '+slides.length;
    startTimer();
  }
  function toggle(){
    playing=!playing;
    play.classList.toggle('playing',playing);
    play.innerHTML=playing?'&#10073;&#10073; Pause':'&#9654; Play';
    play.setAttribute('aria-label',playing?'Pause slideshow':'Play slideshow');
    if(playing && i===slides.length-1) show(0); else startTimer();
  }
  document.getElementById('next').onclick=function(){show(i+1)};
  document.getElementById('prev').onclick=function(){show(i-1)};
  play.onclick=toggle;
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(i+1)}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1)}
    if(e.key==='p'||e.key==='P'){toggle()}
  });
  var x0=null,y0=null;
  deck.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  deck.addEventListener('touchend',function(e){ if(x0===null)return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) show(i+(dx<0?1:-1)); x0=null;},{passive:true});
  deck.addEventListener('click',function(e){
    if(e.target.closest('a,button,.mapbox')) return;
    if(window.innerWidth<860) return;
    show(i+(e.clientX>window.innerWidth*0.5?1:-1));
  });
  load(o);
  window.addEventListener('hashchange',function(){var n=(location.hash.replace('#','')||'tap').toLowerCase(); if(n!==o&&document.getElementById('deck-'+n)) load(n);});
})();
</script>

</html>
